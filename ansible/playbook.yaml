---
- name: Create ASKCOS Chemical Retrosynthesis Secrets
  hosts: localhost
  connection: local
  gather_facts: false
  
  vars:
    # Namespace
    namespace: chemsynth
    
    # Database Credentials - CHANGE THESE
    mongodb_root_password: "CHANGE_ME_mongodb_root_password"
    mongodb_password: "CHANGE_ME_mongodb_password"
    mysql_root_password: "CHANGE_ME_mysql_root_password"
    redis_password: "CHANGE_ME_redis_password"
    rabbitmq_password: "CHANGE_ME_rabbitmq_password"
    
    # ASKCOS Application Secrets - CHANGE THESE
    oauth2_secret_key: "CHANGE_ME_oauth2_secret_key"
    v1_username: "askcos"
    v1_password: "CHANGE_ME_v1_password"
    
    # Container Registry - CHANGE THESE (GitLab registry for FourThievesVinegar images)
    registry_server: "registry.gitlab.com"
    registry_username: "CHANGE_ME_gitlab_username"
    registry_password: "CHANGE_ME_gitlab_access_token"
    registry_email: "CHANGE_ME_your_email@example.com"

  tasks:
    - name: Validate prerequisites
      block:
        - name: Check kubectl is available
          command: kubectl version --client
          register: kubectl_check
          changed_when: false
          failed_when: kubectl_check.rc != 0

    - name: Create MongoDB credentials secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: mongodb-credentials
        state: present
        definition:
          type: Opaque
          stringData:
            mongodb-root-password: "{{ mongodb_root_password }}"
            mongodb-password: "{{ mongodb_password }}"
            mongodb-username: askcos

    - name: Create MySQL credentials secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: mysql-credentials
        state: present
        definition:
          type: Opaque
          stringData:
            mysql-root-password: "{{ mysql_root_password }}"

    - name: Create Redis credentials secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: redis-credentials
        state: present
        definition:
          type: Opaque
          stringData:
            redis-password: "{{ redis_password }}"

    - name: Create RabbitMQ credentials secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: rabbitmq-credentials
        state: present
        definition:
          type: Opaque
          stringData:
            rabbitmq-password: "{{ rabbitmq_password }}"

    - name: Create ASKCOS environment secrets
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: askcos-env
        state: present
        definition:
          type: Opaque
          stringData:
            OAUTH2_SECRET_KEY: "{{ oauth2_secret_key }}"
            V1_USERNAME: "{{ v1_username }}"
            V1_PASSWORD: "{{ v1_password }}"

    - name: Create container registry secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: gitlab-registry
        state: present
        definition:
          type: kubernetes.io/dockerconfigjson
          data:
            ".dockerconfigjson": "{{ lookup('template', 'docker-config.json.j2') | b64encode }}"
      vars:
        docker_auth: "{{ registry_username }}:{{ registry_password }}"

    - name: Display deployment summary
      debug:
        msg: |
          ASKCOS Chemical Retrosynthesis Secrets Created!
          
          Namespace: {{ namespace }}
          
          Secrets Created:
            - mongodb-credentials
            - mysql-credentials
            - redis-credentials
            - rabbitmq-credentials
            - askcos-env
            - gitlab-registry
          
          Next Steps:
            1. Deploy the Argo CD Application: kubectl apply -f k8s/argocd/application.yaml
            2. Argo CD will deploy: namespace, certificate, ingressroute, and ASKCOS helm chart
            3. Monitor deployment: kubectl -n {{ namespace }} get pods
            4. Access application at: https://synth.maus.local
          
          Note: The Argo CD Application uses directoryRecurse to deploy all manifests
          in k8s/chemsynth/ including namespace, certificate, and ingressroute.
