---
- name: Create ASKCOS Chemical Retrosynthesis Secrets
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Namespace
    kubenamespace: chemsynth

    passwd_len: 32

    # User-facing credentials - CHANGE THESE
    v1_username: "askcos"
    v1_password: "CHANGE_ME_v1_password"

    # RabbitMQ username (default for ASKCOS v2)
    rabbitmq_username: "askcos"

    # Container Registry - OPTIONAL (only needed for private registry access)
    # If using public images, these can be left as defaults (anonymous access)
    registry_enabled: false
    registry_server: "registry.gitlab.com"
    registry_username: ""
    registry_password: ""
    registry_email: ""

  tasks:
    - name: Validate prerequisites
      block:
        - name: Check kubectl is available
          ansible.builtin.command: kubectl version --client
          register: kubectl_check
          changed_when: false
          failed_when: kubectl_check.rc != 0

        # todo check the python module kubernetes

        # todo check if password was changed for real

    - name: Create namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ kubenamespace }}"
        state: present
        definition:
          metadata:
            labels:
              name: "{{ kubenamespace }}"
              app.kubernetes.io/part-of: askcos

    - name: Generate random MongoDB passwords
      ansible.builtin.set_fact:
        mongodb_root_password: "{{ lookup('password', '/tmp/mongoroot', length=passwd_len) }}"
        mongodb_password: "{{ lookup('password', '/tmp/mongo', length=passwd_len) }}"

    - name: Generate random MySQL password
      ansible.builtin.set_fact:
        mysql_root_password: "{{ lookup('password', '/tmp/mysql', length=passwd_len) }}"

    - name: Generate random Redis password
      ansible.builtin.set_fact:
        redis_password: "{{ lookup('password', '/tmp/redis', length=passwd_len) }}"

    - name: Generate random RabbitMQ password
      ansible.builtin.set_fact:
        rabbitmq_password: "{{ lookup('password', '/tmp/rabbitmq', length=passwd_len) }}"

    - name: Generate random MySQL password
      ansible.builtin.set_fact:
        mysql_root_password: "{{ lookup('password', '/tmp/mysql', length=passwd_len) }}"

    - name: Create MongoDB credentials secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ kubenamespace }}"
        name: mongodb-credentials
        state: present
        definition:
          type: Opaque
          stringData:
            mongodb-root-password: "{{ mongodb_root_password }}"
            mongodb-password: "{{ mongodb_password }}"
            mongodb-username: askcos

    - name: Create MySQL credentials secret (for Keycloak if enabled)
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ kubenamespace }}"
        name: mysql-credentials
        state: present
        definition:
          type: Opaque
          stringData:
            mysql-root-password: "{{ mysql_root_password }}"
      when: false  # MySQL not used in v2 by default, only for Keycloak

    - name: Create Redis credentials secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ kubenamespace }}"
        name: redis-credentials
        state: present
        definition:
          type: Opaque
          stringData:
            redis-password: "{{ redis_password }}"

    - name: Create RabbitMQ credentials secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ kubenamespace }}"
        name: rabbitmq-credentials
        state: present
        definition:
          type: Opaque
          stringData:
            rabbitmq-username: "{{ rabbitmq_username }}"
            rabbitmq-password: "{{ rabbitmq_password }}"

    - name: Create ASKCOS environment secrets
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ kubenamespace }}"
        name: askcos-env
        state: present
        definition:
          type: Opaque
          stringData:
            V1_USERNAME: "{{ v1_username }}"
            V1_PASSWORD: "{{ v1_password }}"
            OAUTH2_SECRET_KEY: >-
              {{ lookup('password', '/tmp/oauth2-secret', length=64,
              chars='ascii_letters,digits') }}

    - name: Create container registry secret (optional)
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ kubenamespace }}"
        name: gitlab-registry
        state: present
        definition:
          type: kubernetes.io/dockerconfigjson
          data:
            ".dockerconfigjson": "{{ lookup('template', 'docker-config.json.j2') | b64encode }}"
      vars:
        docker_auth: "{{ registry_username }}:{{ registry_password }}"
      when: registry_enabled | bool

    - name: Deploy Argo CD Application
      kubernetes.core.k8s:
        state: present
        src: "./../k8s/argocd/application.yaml"

    - name: Display generated passwords
      ansible.builtin.debug:
        msg: |
          Generated Database Passwords (store these securely):
          MongoDB Root: {{ mongodb_root_password }}
          MongoDB User: {{ mongodb_password }}
          MySQL Root: {{ mysql_root_password }}
          Redis: {{ redis_password }}
          RabbitMQ: {{ rabbitmq_password }}

    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          ASKCOS Chemical Retrosynthesis Secrets Created!

          Namespace: {{ kubenamespace }}

          Secrets Created:
            - mongodb-credentials (with auto-generated passwords)
            - mysql-credentials (with auto-generated password)
            - redis-credentials (with auto-generated password)
            - rabbitmq-credentials (with auto-generated password)
            - askcos-env (with your V1 credentials)
          {% if registry_enabled | bool %}
            - gitlab-registry (container registry credentials)
          {% else %}
            - gitlab-registry (SKIPPED - using anonymous access)
          {% endif %}

          Next Steps:
            1. Argo CD will deploy: namespace, certificate, ingressroute, and all ASKCOS components
            2. Monitor deployment: kubectl -n {{ kubenamespace }} get pods
            3. Access application at: https://synth.maus.local

          Note: Database passwords have been auto-generated with secure random values.
          Only V1_PASSWORD needs to be set by you (user-facing credential).
