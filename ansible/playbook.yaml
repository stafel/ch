---
- name: Create ASKCOS Chemical Retrosynthesis Secrets
  hosts: localhost
  connection: local
  gather_facts: false
  
  vars:
    # Namespace
    namespace: chemsynth
    
    # User-facing credentials - CHANGE THESE
    v1_username: "askcos"
    v1_password: "CHANGE_ME_v1_password"
    
    # Container Registry - OPTIONAL (only needed for private registry access)
    # If using public images, these can be left as defaults (anonymous access)
    registry_enabled: false
    registry_server: "registry.gitlab.com"
    registry_username: ""
    registry_password: ""
    registry_email: ""

  tasks:
    - name: Validate prerequisites
      block:
        - name: Check kubectl is available
          command: kubectl version --client
          register: kubectl_check
          changed_when: false
          failed_when: kubectl_check.rc != 0

    - name: Generate random MongoDB passwords
      set_fact:
        mongodb_root_password: "{{ lookup('password', 'chars=ascii_letters,digits,hexdigits,special,length=32') }}"
        mongodb_password: "{{ lookup('password', 'chars=ascii_letters,digits,hexdigits,special,length=32') }}"

    - name: Generate random MySQL password
      set_fact:
        mysql_root_password: "{{ lookup('password', 'chars=ascii_letters,digits,hexdigits,special,length=32') }}"

    - name: Generate random Redis password
      set_fact:
        redis_password: "{{ lookup('password', 'chars=ascii_letters,digits,hexdigits,special,length=32') }}"

    - name: Generate random RabbitMQ password
      set_fact:
        rabbitmq_password: "{{ lookup('password', 'chars=ascii_letters,digits,hexdigits,special,length=32') }}"

    - name: Create MongoDB credentials secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: mongodb-credentials
        state: present
        definition:
          type: Opaque
          stringData:
            mongodb-root-password: "{{ mongodb_root_password }}"
            mongodb-password: "{{ mongodb_password }}"
            mongodb-username: askcos

    - name: Create MySQL credentials secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: mysql-credentials
        state: present
        definition:
          type: Opaque
          stringData:
            mysql-root-password: "{{ mysql_root_password }}"

    - name: Create Redis credentials secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: redis-credentials
        state: present
        definition:
          type: Opaque
          stringData:
            redis-password: "{{ redis_password }}"

    - name: Create RabbitMQ credentials secret
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: rabbitmq-credentials
        state: present
        definition:
          type: Opaque
          stringData:
            rabbitmq-password: "{{ rabbitmq_password }}"

    - name: Create ASKCOS environment secrets
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: askcos-env
        state: present
        definition:
          type: Opaque
          stringData:
            V1_USERNAME: "{{ v1_username }}"
            V1_PASSWORD: "{{ v1_password }}"

    - name: Create container registry secret (optional)
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        namespace: "{{ namespace }}"
        name: gitlab-registry
        state: present
        definition:
          type: kubernetes.io/dockerconfigjson
          data:
            ".dockerconfigjson": "{{ lookup('template', 'docker-config.json.j2') | b64encode }}"
      vars:
        docker_auth: "{{ registry_username }}:{{ registry_password }}"
      when: registry_enabled | bool

    - name: Display generated passwords
      debug:
        msg: |
          Generated Database Passwords (store these securely):
          MongoDB Root: {{ mongodb_root_password }}
          MongoDB User: {{ mongodb_password }}
          MySQL Root: {{ mysql_root_password }}
          Redis: {{ redis_password }}
          RabbitMQ: {{ rabbitmq_password }}

    - name: Display deployment summary
      debug:
        msg: |
          ASKCOS Chemical Retrosynthesis Secrets Created!
          
          Namespace: {{ namespace }}
          
          Secrets Created:
            - mongodb-credentials (with auto-generated passwords)
            - mysql-credentials (with auto-generated password)
            - redis-credentials (with auto-generated password)
            - rabbitmq-credentials (with auto-generated password)
            - askcos-env (with your V1 credentials)
          {% if registry_enabled | bool %}
            - gitlab-registry (container registry credentials)
          {% else %}
            - gitlab-registry (SKIPPED - using anonymous access)
          {% endif %}
          
          Next Steps:
            1. Deploy the Argo CD Application: kubectl apply -f k8s/argocd/application.yaml
            2. Argo CD will deploy: namespace, certificate, ingressroute, and all ASKCOS components
            3. Monitor deployment: kubectl -n {{ namespace }} get pods
            4. Access application at: https://synth.maus.local
          
          Note: Database passwords have been auto-generated with secure random values.
          Only V1_PASSWORD needs to be set by you (user-facing credential).
