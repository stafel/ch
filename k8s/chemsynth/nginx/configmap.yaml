apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: chemsynth
  labels:
    app: askcos-nginx
    app.kubernetes.io/part-of: askcos
data:
  askcos.conf: |
    server {
      listen 8080;
      server_name _;

      location / {
        proxy_pass http://askcos-app:9100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /static/ {
        alias /static/;
        expires 30d;
      }
    }
