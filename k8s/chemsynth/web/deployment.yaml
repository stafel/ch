apiVersion: apps/v1
kind: Deployment
metadata:
  name: askcos-web
  namespace: chemsynth
  labels:
    app: askcos-web
    app.kubernetes.io/part-of: askcos
    version: "2.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: askcos-web
  template:
    metadata:
      labels:
        app: askcos-web
        app.kubernetes.io/part-of: askcos
        version: "2.0"
    spec:
      containers:
        - name: web
          image: registry.gitlab.com/mlpds_mit/askcosv2/askcos-vue-nginx:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          envFrom:
            - configMapRef:
                name: askcos-config
          env:
            - name: VITE_ORGANIZATION
              value: "ChemSynth"
            - name: VITE_ENABLE_SMILES_RESOLVER
              value: "False"
            - name: VITE_CONTACT_EMAIL
              value: "admin@maus.local"
            - name: VITE_SUPPORT_EMAILS
              value: "admin@maus.local"
            - name: VITE_VERSION
              value: "2026.07"
            - name: VITE_EMAIL_REQUIRED
              value: "False"
            - name: VITE_GUEST_LOGIN
              value: "True"
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: askcos-web
  namespace: chemsynth
  labels:
    app: askcos-web
    app.kubernetes.io/part-of: askcos
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: askcos-web
