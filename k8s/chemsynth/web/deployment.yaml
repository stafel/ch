apiVersion: apps/v1
kind: Deployment
metadata:
  name: askcos-web
  namespace: chemsynth
  labels:
    app: askcos-web
    app.kubernetes.io/part-of: askcos
    version: "2.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: askcos-web
  template:
    metadata:
      labels:
        app: askcos-web
        app.kubernetes.io/part-of: askcos
        version: "2.0"
    spec:
      containers:
        - name: web
          image: registry.gitlab.com/mlpds_mit/askcosv2/askcos-vue-nginx:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          envFrom:
            - configMapRef:
                name: askcos-config
          env:
            - name: VITE_ORGANIZATION
              value: "ChemSynth"
            - name: VITE_ENABLE_SMILES_RESOLVER
              value: "False"
            - name: VITE_CONTACT_EMAIL
              value: "admin@maus.local"
            - name: VITE_SUPPORT_EMAILS
              value: "admin@maus.local"
            - name: VITE_VERSION
              value: "2026.07"
            - name: VITE_EMAIL_REQUIRED
              value: "False"
            - name: VITE_GUEST_LOGIN
              value: "True"
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: nginx-config
          configMap:
            name: askcos-web-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: askcos-web
  namespace: chemsynth
  labels:
    app: askcos-web
    app.kubernetes.io/part-of: askcos
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: askcos-web
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: askcos-web-nginx
  namespace: chemsynth
  labels:
    app: askcos-web
    app.kubernetes.io/part-of: askcos
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      proxy_read_timeout 600;
      uwsgi_read_timeout 600;

      server {
        listen 80;
        server_name _;
        client_max_body_size 25M;

        location / {
          root /usr/share/nginx/html;
          index index.html;
          try_files $uri $uri/ /index.html;
        }

        location /api/ {
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_pass http://askcos-app:9100;
        }
      }
    }
