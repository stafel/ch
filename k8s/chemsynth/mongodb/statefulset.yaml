apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: chemsynth
  labels:
    app: mongodb
    app.kubernetes.io/part-of: askcos
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
      app.kubernetes.io/part-of: askcos
  template:
    metadata:
      labels:
        app: mongodb
        app.kubernetes.io/part-of: askcos
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0.9-jammy
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: mongodb-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: mongodb-root-password
            - name: MONGO_INITDB_DATABASE
              value: "askcos"
          args:
            - --wiredTigerCacheSizeGB
            - "1.5"
            - --bind_ip_all
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 4Gi
              cpu: 2
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
        labels:
          app: mongodb
          app.kubernetes.io/part-of: askcos
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: chemsynth
  labels:
    app: mongodb
    app.kubernetes.io/part-of: askcos
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app: mongodb
    app.kubernetes.io/part-of: askcos
