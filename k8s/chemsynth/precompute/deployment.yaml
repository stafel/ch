apiVersion: apps/v1
kind: Deployment
metadata:
  name: askcos-precompute
  namespace: chemsynth
  labels:
    app: askcos-precompute
    app.kubernetes.io/part-of: askcos
    version: "2.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: askcos-precompute
  template:
    metadata:
      labels:
        app: askcos-precompute
        app.kubernetes.io/part-of: askcos
        version: "2.0"
    spec:
      containers:
        - name: precompute
          image: registry.gitlab.com/mlpds_mit/askcosv2/askcos2_core/precompute:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9100
              name: http
          envFrom:
            - configMapRef:
                name: askcos-config
            - secretRef:
                name: askcos-env
          env:
            - name: MONGO_PW
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: mongodb-password
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: mongodb-root-password
          volumeMounts:
            - name: precompute-data
              mountPath: /ASKCOSv2/askcos2_core/data/precompute
            - name: buyables-cache
              mountPath: /ASKCOSv2/askcos2_core/data/db/buyables
          resources:
            requests:
              memory: 4Gi
              cpu: 1
            limits:
              memory: 8Gi
              cpu: 2
          livenessProbe:
            httpGet:
              path: /
              port: 9100
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 9100
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: precompute-data
          persistentVolumeClaim:
            claimName: askcos-precompute-data
        - name: buyables-cache
          persistentVolumeClaim:
            claimName: askcos-buyables-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: askcos-precompute-data
  namespace: chemsynth
  labels:
    app: askcos-precompute
    app.kubernetes.io/part-of: askcos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: askcos-buyables-cache
  namespace: chemsynth
  labels:
    app: askcos-precompute
    app.kubernetes.io/part-of: askcos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
