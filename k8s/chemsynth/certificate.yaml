apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: synth-maus-local
  namespace: chemsynth
spec:
  secretName: synth-maus-local-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - synth.maus.local
  # For self-signed or local CA, use:
  # issuerRef:
  #   name: selfsigned-issuer
  #   kind: Issuer
  #   group: cert-manager.io
