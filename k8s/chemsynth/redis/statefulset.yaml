apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: chemsynth
  labels:
    app: redis
    app.kubernetes.io/part-of: askcos
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
      app.kubernetes.io/part-of: askcos
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: askcos
    spec:
      containers:
        - name: redis
          image: redis:7.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          args:
            - redis-server
            - --port
            - "6379"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 500m
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 2
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app: redis
          app.kubernetes.io/part-of: askcos
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: chemsynth
  labels:
    app: redis
    app.kubernetes.io/part-of: askcos
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: redis
    app.kubernetes.io/part-of: askcos
