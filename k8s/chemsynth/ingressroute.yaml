apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: askcos-ingress
  namespace: chemsynth
  labels:
    app: askcos
    app.kubernetes.io/part-of: askcos
spec:
  tls:
    - hosts:
        - synth.maus.local
      secretName: synth-maus-local-tls
  rules:
    - host: synth.maus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: askcos-web
                port:
                  number: 80
