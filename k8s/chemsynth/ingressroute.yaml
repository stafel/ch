apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: askcos-ingress
  namespace: chemsynth
  labels:
    app: askcos
    app.kubernetes.io/part-of: askcos
  annotations:
    # cert-manager annotations for TLS certificate
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Ingress class (use your cluster's ingress class)
    kubernetes.io/ingress.class: "traefik"
    # For HTTPS redirect
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - synth.maus.local
      secretName: synth-maus-local-tls
  rules:
    - host: synth.maus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: askcos-web
                port:
                  number: 80
