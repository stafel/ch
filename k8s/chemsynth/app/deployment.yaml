apiVersion: apps/v1
kind: Deployment
metadata:
  name: askcos-app
  namespace: chemsynth
  labels:
    app: askcos-app
    app.kubernetes.io/part-of: askcos
    version: "2.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: askcos-app
  template:
    metadata:
      labels:
        app: askcos-app
        app.kubernetes.io/part-of: askcos
        version: "2.0"
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: app
          image: registry.gitlab.com/mlpds_mit/askcosv2/askcos2_core/app:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9100
              name: http
          envFrom:
            - configMapRef:
                name: askcos-config
            - secretRef:
                name: askcos-env
          env:
            - name: MONGO_PW
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: mongodb-password
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: mongodb-root-password
            - name: OAUTH2_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: askcos-env
                  key: OAUTH2_SECRET_KEY
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 4Gi
              cpu: 2
          livenessProbe:
            httpGet:
              path: /api/admin/get-backend-status
              port: 9100
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/admin/get-backend-status
              port: 9100
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: askcos-app
  namespace: chemsynth
  labels:
    app: askcos-app
    app.kubernetes.io/part-of: askcos
spec:
  type: ClusterIP
  ports:
    - port: 9100
      targetPort: 9100
      name: http
  selector:
    app: askcos-app
