apiVersion: apps/v1
kind: Deployment
metadata:
  name: askcos-app
  namespace: chemsynth
  labels:
    app: askcos-app
    app.kubernetes.io/part-of: askcos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: askcos-app
  template:
    metadata:
      labels:
        app: askcos-app
        app.kubernetes.io/part-of: askcos
    spec:
      containers:
        - name: app
          image: registry.gitlab.com/mlpds_mit/askcosv2/askcos2_core/app:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9100
              name: http
          env:
            - name: CURRENT_HOST
              value: "synth.maus.local"
            - name: ORGANIZATION
              value: "ChemSynth"
            - name: CONTACT_EMAIL
              value: "admin@maus.local"
            - name: SUPPORT_EMAILS
              value: "admin@maus.local"
            - name: ENABLE_SMILES_RESOLVER
              value: "False"
            - name: AUTH_MODIFY_BUYABLES
              value: "False"
            - name: OAUTH2_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: askcos-env
                  key: OAUTH2_SECRET_KEY
            - name: V1_USERNAME
              valueFrom:
                secretKeyRef:
                  name: askcos-env
                  key: V1_USERNAME
            - name: V1_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: askcos-env
                  key: V1_PASSWORD
            - name: MONGO_HOST
              value: "mongodb.chemsynth.svc.cluster.local"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USER
              value: "askcos"
            - name: MONGO_PW
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: mongodb-password
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "askcos"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: mongodb-root-password
            - name: REDIS_HOST
              value: "redis.chemsynth.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: RABBITMQ_HOST
              value: "rabbitmq.chemsynth.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
          resources:
            requests:
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 9100
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 9100
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: askcos-app
  namespace: chemsynth
  labels:
    app: askcos-app
    app.kubernetes.io/part-of: askcos
spec:
  type: ClusterIP
  ports:
    - port: 9100
      targetPort: 9100
      name: http
  selector:
    app: askcos-app
