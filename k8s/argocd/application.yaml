apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: askcos-chemsynth
  namespace: argocd
  labels:
    app.kubernetes.io/name: askcos
    app.kubernetes.io/part-of: chemsynth
spec:
  project: default
  source:
    repoURL: https://github.com/ASKCOS/askcos-deploy.git
    targetRevision: main
    path: helm/askcos
    helm:
      releaseName: askcos
      # Override values for chemsynth deployment
      values: |-
        nameOverride: askcos
        fullnameOverride: askcos
        
        # Custom environment variables
        env:
          CURRENT_HOST: "synth.maus.local"
          ORGANIZATION: "ChemSynth"
          CONTACT_EMAIL: "admin@maus.local"
          SUPPORT_EMAILS: "admin@maus.local"
          ENABLE_SMILES_RESOLVER: "False"
          AUTH_MODIFY_BUYABLES: "False"
        
        # Image configuration - using FourThievesVinegar images
        app:
          image:
            repository: registry.gitlab.com/mlpds_mit/askcosv2/askcos2_core/app
            tag: "2.0"
            pullPolicy: IfNotPresent
          replicaCount: 1
          service:
            type: ClusterIP
            port: 9100
          resources:
            requests:
              memory: "2.0G"
        
        # Nginx configuration for Traefik
        nginx:
          name: nginx
          image:
            repository: bitnami/nginx
            tag: 1.25-debian-12
            pullPolicy: IfNotPresent
          replicaCount: 1
          containerPorts:
            http: 8080
          service:
            type: ClusterIP
            port: 80
          resources:
            requests:
              memory: "256M"
        
        # Celery workers - reduced for resource constraints
        celery:
          - name: atommappingworker
            replicaCount: 1
            cmd: "celery -A askcos_site worker -c 1 -Q atom_mapping_worker -n atom_mapping_worker@%h --pool=gevent"
          - name: crnetworkworker
            replicaCount: 1
            cmd: "celery -A askcos_site worker -c 1 -Q cr_network_worker -n cr_network_worker@%h --pool=gevent"
          - name: descriptorsworker
            replicaCount: 1
            cmd: "celery -A askcos_site worker -c 1 -Q descriptors_worker -n descriptors_worker@%h"
          - name: sitesworker
            replicaCount: 1
            cmd: "celery -A askcos_site worker -c 1 -Q sites_worker -n sites_worker@%h --pool=gevent"
          - name: tffpworker
            replicaCount: 1
            cmd: "celery -A askcos_site worker -c 1 -Q tffp_worker -n tffp_worker@%h --pool=gevent"
        
        # Disable ML servers for minimal deployment
        mlserver: []
        
        # Database configurations
        mongodb:
          enabled: true
          architecture: standalone
          auth:
            rootPassword: ""
            username: askcos
            password: ""
            database: askcos
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "2Gi"
          persistence:
            enabled: true
            size: 10Gi
        
        mysql:
          enabled: true
          db:
            name: askcos_db
          root:
            password: ""
          replication:
            enabled: false
          resources:
            requests:
              memory: "512M"
        
        rabbitmq:
          auth:
            username: guest
            password: guest
          resources:
            requests:
              memory: "256M"
        
        redis:
          cluster:
            enabled: false
          usePassword: false
          password: ""
          resources:
            requests:
              memory: "128M"
        
        # Disable mongo seeding for initial deploy
        mongoSeed:
          enabled: false
        
        # Service account
        serviceAccount:
          create: true
          annotations: {}
        
        # Image pull secrets - to be created separately
        imagePullSecrets: []
  destination:
    server: https://kubernetes.default.svc
    namespace: chemsynth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - kind: Secret
      jsonPointers:
        - /data
