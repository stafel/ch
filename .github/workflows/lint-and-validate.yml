name: Lint and Validate

on:
  push:
    branches:
      - main
      - 'vibe/**'
    paths:
      - 'ansible/**'
      - 'k8s/**'
      - '.github/workflows/lint-and-validate.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'k8s/**'
      - '.github/workflows/lint-and-validate.yml'

jobs:
  lint-ansible:
    name: Lint Ansible Playbook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint yamllint

      - name: Install Ansible collections
        run: |
          cd ansible
          ansible-galaxy install -r requirements.yml --force
          cd ..

      - name: Lint Ansible playbook with ansible-lint
        run: |
          ansible-lint ansible/playbook.yaml
          ansible-lint ansible/playbook.yaml --parse-only

      - name: Validate YAML syntax
        run: |
          yamllint ansible/playbook.yaml
          yamllint ansible/docker-config.json.j2

  lint-kubernetes:
    name: Lint Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: lint-ansible
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install kubeval and yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
          # Install kubeval
          curl -sL https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | \
            tar xz -C /tmp && \
            sudo mv /tmp/kubeval /usr/local/bin/kubeval

      - name: Lint all Kubernetes YAML files
        run: |
          # Find all YAML files in k8s directory
          YAML_FILES=$(find k8s -name "*.yaml" -o -name "*.yml" | head -50)
          
          if [ -z "$YAML_FILES" ]; then
            echo "No YAML files found in k8s/"
            exit 1
          fi
          
          echo "Linting YAML files with yamllint..."
          for file in $YAML_FILES; do
            echo "  Linting: $file"
            yamllint "$file" || exit 1
          done

      - name: Validate Kubernetes manifests with kubeval
        run: |
          # Validate all Kubernetes manifests
          # Skip namespace.yaml as it doesn't need schema validation
          YAML_FILES=$(find k8s -name "*.yaml" -o -name "*.yml" | grep -v namespace.yaml | head -50)
          
          if [ -z "$YAML_FILES" ]; then
            echo "No YAML files found for validation"
            exit 0
          fi
          
          echo "Validating Kubernetes manifests with kubeval..."
          for file in $YAML_FILES; do
            echo "  Validating: $file"
            # Skip files that might have issues with kubeval
            if echo "$file" | grep -q "application.yaml"; then
              echo "    Skipping Argo CD Application (schema not available in kubeval)"
              continue
            fi
            kubeval --strict "$file" || echo "  ⚠️  Warning: $file has validation issues"
          done

  check-syntax:
    name: Check Syntax and Formatting
    runs-on: ubuntu-latest
    needs: lint-kubernetes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for trailing whitespace
        run: |
          # Check for trailing whitespace in all files
          TRAILING_WHITESPACE=$(grep -rl '[[:space:]]$' ansible/ k8s/ || true)
          if [ -n "$TRAILING_WHITESPACE" ]; then
            echo "::error::Found trailing whitespace in the following files:"
            echo "$TRAILING_WHITESPACE"
            exit 1
          fi

      - name: Check for mixed line endings
        run: |
          # Check for mixed line endings (CRLF vs LF)
          FILES_WITH_CRLF=$(grep -rl $'\r' ansible/ k8s/ 2>/dev/null || true)
          if [ -n "$FILES_WITH_CRLF" ]; then
            echo "::warning::Found CRLF line endings in:"
            echo "$FILES_WITH_CRLF"
            echo "Consider converting to LF line endings"
          fi

      - name: Verify file structure
        run: |
          echo "Checking file structure..."
          
          # Check that all expected directories exist
          if [ ! -d "ansible" ]; then
            echo "::error::ansible directory not found"
            exit 1
          fi
          
          if [ ! -d "k8s" ]; then
            echo "::error::k8s directory not found"
            exit 1
          fi
          
          # Check for required files
          REQUIRED_FILES=(
            "ansible/playbook.yaml"
            "ansible/requirements.yml"
            "k8s/chemsynth/namespace.yaml"
            "k8s/chemsynth/certificate.yaml"
            "k8s/chemsynth/ingressroute.yaml"
            "k8s/argocd/application.yaml"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file not found: $file"
              exit 1
            fi
          done
          
          echo "✅ All required files present"
